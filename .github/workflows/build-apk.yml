name: Build Android APK

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: libcore/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android NDK
        run: |
          echo "Installing NDK 29.0.14206865..."
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Make Scripts Executable
        run: |
          chmod +x run gradlew libcore/build.sh
          find buildScript -type f -name "*.sh" -exec chmod +x {} +

      - name: Run Libcore Finalmask Tests
        run: |
          cd libcore
          go test -v ./plugin/finalmask/...

      - name: Generate Release Keystore
        run: |
          rm -f release.keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias husi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Husi, OU=Husi, O=Husi, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_PASS=123456" >> local.properties
          echo "ALIAS_NAME=husi" >> local.properties
          echo "ALIAS_PASS=123456" >> local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build Assets (GeoIP / GeoSite)
        run: |
          make assets

      - name: Build Libcore Android (AAR)
        run: |
          make libcore_android

      - name: Build Android Release APK
        run: |
          make apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husi-apks
          path: androidApp/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
