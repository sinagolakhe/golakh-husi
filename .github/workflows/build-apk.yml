name: Build Android APK

on:
  push:
    branches: [ "dev", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: libcore/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android NDK
        run: |
          echo "Installing NDK 29.0.14206865..."
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "NDK=${ANDROID_HOME}/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Make Scripts Executable
        run: |
          chmod +x run gradlew libcore/build.sh
          find buildScript -type f -name "*.sh" -exec chmod +x {} +

      - name: Run Libcore Finalmask Tests
        run: |
          cd libcore
          go test -v ./plugin/finalmask/...

      - name: Generate Release Keystore
        run: |
          rm -f release.keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias husi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=Husi, OU=Husi, O=Husi, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_PASS=123456" >> local.properties
          echo "ALIAS_NAME=husi" >> local.properties
          echo "ALIAS_PASS=123456" >> local.properties
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Build Assets (GeoIP / GeoSite)
        run: |
          make assets

      - name: Build Libcore Android (AAR)
        run: |
          make libcore_android

      - name: Build Android Release APK
        run: |
          make apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: husi-apks
          path: androidApp/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Husi {0} (Finalmask & Cipher Suites)', github.ref_name) || 'Husi Latest (Finalmask & Cipher Suites)' }}
          body: |
            ### Husi with PattNG Finalmask & Cipher Suites Support

            Android Release APKs supporting PattNG's **Xray-compatible `finalmask` TCP/TLS fragmentation** and **custom `cipher_suites`** for VLESS over TLS, enabling bypass of DPI firewall blocks on Cloudflare IPs.

            #### Downloads:
            - **`husi-*-universal-foss-release.apk`**: Universal APK (recommended for all Android devices).
            - **`husi-*-arm64-v8a-foss-release.apk`**: Architecture-specific APK for 64-bit ARM devices.

            #### Features:
            - **Finalmask TCP & TLS Fragmentation Engine**: Circumvents Cloudflare IP / SNI firewall blocking by splitting TLS ClientHello records (`tlshello`) and initial TCP packets (`1-1`).
            - **Custom Cipher Suites**: Supports custom TLS cipher suites for VLESS profiles.
          files: androidApp/build/outputs/apk/foss/release/*.apk
          fail_on_unmatched_files: false
          make_latest: "true"
